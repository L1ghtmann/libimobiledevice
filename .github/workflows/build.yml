name: build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include: [
          { msystem: mingw64, arch: x86_64 }
        ]
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        release: false
        update: false
        install: >-
          base-devel
          git
          mingw-w64-${{ matrix.arch }}-gcc
          make
          libtool
          autoconf
          automake-wrapper
          mingw-w64-${{ matrix.arch }}-pkgconf
          mingw-w64-${{ matrix.arch }}-libzip
          mingw-w64-${{ matrix.arch }}-libxml2
          mingw-w64-${{ matrix.arch }}-curl
          mingw-w64-${{ matrix.arch }}-github-cli

    - uses: actions/checkout@v4
    - name: prepare environment
      run: |
        echo "target_triplet=`gcc -dumpmachine`" >> $GITHUB_ENV
        git config --global core.autocrlf false

    # libimobiledevice deps (1-3/8), libimobiledevice (4/8), and then unrelated projects (5-8/8)
    - name: build projects
      run: |
        repos=("libplist" "libimobiledevice-glue" "libusbmuxd" "libtatsu" "libimobiledevice" "libideviceactivation" "ideviceinstaller" "libirecovery" "idevicerestore")
        for repo in "${repos[@]}"; do
            echo "Building $repo..."
            git clone --depth=1 --recursive "https://github.com/libimobiledevice/$repo"
            pushd "$repo" > /dev/null
            ./autogen.sh CC=gcc CXX=g++ --enable-debug --without-cython
            make -j install
            popd > /dev/null
        done

    - name: prepare release
      run: |
        mkdir -p rel
        # Copy binaries first
        find /mingw64/bin/ -type f \( -name "*idevice*" -o -name "*irecovery*" -o \
                                      -name "plistutil.exe" -o -name "inetcat.exe" -o \
                                      -name "iproxy.exe" \) -exec cp -v {} rel \;
        # Resolve all DLL deps recursively from /mingw64
        resolve_deps() {
          ldd "$1" 2>/dev/null | awk '/\/mingw64\/bin\// {print $3}' | while read dll; do
            base=$(basename "$dll")
            if [ ! -f "rel/$base" ]; then
              cp -v "$dll" rel/
              resolve_deps "$dll"
            fi
          done
        }
        for exe in rel/*.exe; do
          resolve_deps "$exe"
        done
        tar -C rel -cJvf libimobile-suite-latest_${{ matrix.arch }}-${{ matrix.msystem }}.tar.xz .

    - name: publish release
      env:
        github_token: ${{secrets.GITHUB_TOKEN}}
      run: |
        TAG="${GITHUB_REF##*/}-${GITHUB_SHA:0:7}"
        gh release create "$TAG" --draft --title "Draft Release"
        gh release upload "$TAG" libimobile-suite-latest_${{ matrix.arch }}-${{ matrix.msystem }}.tar.xz
